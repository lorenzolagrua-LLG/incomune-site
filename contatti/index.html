<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>InComune · Contatti inviti</title>
<!-- Pagina interna del team: non collegata dal resto del sito e fuori dai motori di ricerca.
     Funziona solo col codice nel link (dopo il #), che non sta in questo repo. -->
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<meta name="theme-color" content="#FAF8F4">

<link rel="preload" href="/assets/fonts/Nunito-400.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/fonts/Nunito-700.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/fonts/Nunito-800.ttf" as="font" type="font/ttf" crossorigin>
<link rel="preload" href="/assets/fonts/DMSerifDisplay-400.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/styles.css">

<style>
  html, body { background: var(--avorio); }
  body { padding-bottom: env(safe-area-inset-bottom); }
  .col { width: 100%; max-width: 640px; margin-inline: auto; padding-inline: 16px; }

  /* Testata */
  .top { padding-top: calc(28px + env(safe-area-inset-top)); padding-bottom: 8px; }
  .top-row { display: flex; align-items: center; gap: 12px; }
  .top-row img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .top h1 { font-family: var(--font-serif); font-weight: 400; font-size: 1.9rem; line-height: 1.05; color: var(--text); }
  .top p { color: var(--text-secondary); font-size: var(--fs-small); margin-top: 2px; }

  /* Barra fissa */
  .bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--avorio) 94%, transparent);
         -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
         border-bottom: 1px solid var(--pill-quieto); padding-block: 10px; }
  .search { position: relative; }
  .search input { width: 100%; height: 48px; border-radius: var(--r-capsule); border: 1.5px solid var(--border);
                  background: var(--surface); padding: 0 44px 0 44px; font: inherit; font-size: 1.05rem; color: var(--text); }
  .search input:focus { outline: none; border-color: var(--terracotta); box-shadow: 0 0 0 3px rgba(241,113,0,.16); }
  .search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .clear { position: absolute; right: 2px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px;
                   border-radius: 50%; border: 0; background: var(--pill-quieto-sottile); color: var(--pill-text);
                   font-size: 1.1rem; cursor: pointer; display: none; }
  .search.has-q .clear { display: block; }

  .row-ctl { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .row-ctl::-webkit-scrollbar { display: none; }
  .chip { flex: none; height: 44px; padding: 0 16px; border-radius: var(--r-pill); border: 1px solid transparent;
          background: var(--pill-quieto-sottile); color: var(--pill-text); font: inherit; font-weight: 700;
          font-size: .9rem; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip[aria-pressed="true"] { background: var(--terracotta); color: #fff; }
  .chip.me-missing { border-color: var(--rosso-pompeiano); animation: nudge .5s var(--ease); }
  .ctl-label { flex: none; align-self: center; font-size: .8rem; font-weight: 800; letter-spacing: .06em;
               text-transform: uppercase; color: var(--text-secondary); margin-left: 4px; }
  @keyframes nudge { 0%,100% { transform: none; } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }

  /* Contatori come salti di sezione */
  .jumps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 4px; }
  .jump { display: block; width: 100%; text-align: left; border: 0; font: inherit; cursor: pointer;
          background: var(--surface); border-radius: var(--r-lg); padding: 10px 12px;
          box-shadow: var(--shadow-sm); color: var(--text); }
  .jump b { display: block; font-size: 1.25rem; font-weight: 800; line-height: 1.1; }
  .jump b small { font-size: .85rem; font-weight: 700; color: var(--text-secondary); }
  .jump span { font-size: .8rem; color: var(--text-secondary); font-weight: 700; }
  .jump .meter { height: 4px; border-radius: 2px; background: var(--pill-quieto); margin-top: 8px; overflow: hidden; }
  .jump .meter i { display: block; height: 100%; background: var(--verde-ulivo); border-radius: 2px; transition: width .4s var(--ease); }

  /* Sezioni */
  section.sez { padding-top: 22px; scroll-margin-top: 150px; }
  .sez h2 { font-family: var(--font-serif); font-weight: 400; font-size: 1.5rem; color: var(--text);
            display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .sez h2 span { font-family: var(--font-sans); font-size: .85rem; font-weight: 700; color: var(--text-secondary); }
  .list { list-style: none; background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow-sm); overflow: hidden; }
  .empty { padding: 18px 16px; color: var(--text-secondary); font-size: var(--fs-small); }

  .item { border-top: 1px solid var(--pill-quieto-sottile); }
  .item:first-child { border-top: 0; }
  .item-main { display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 8px; min-height: 64px; }
  .tick { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: transparent;
          display: grid; place-items: center; cursor: pointer; }
  .tick i { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border); display: grid; place-items: center;
            transition: background .15s, border-color .15s; }
  .tick i svg { opacity: 0; transform: scale(.6); transition: opacity .15s, transform .2s var(--ease); }
  .item.done .tick i { background: var(--verde-ulivo); border-color: var(--verde-ulivo); }
  .item.done .tick i svg { opacity: 1; transform: none; }
  .item.open:not(.done) .tick i { border-color: var(--terracotta); }
  .body { flex: 1; min-width: 0; }
  .name { font-weight: 700; color: var(--text); line-height: 1.25; overflow-wrap: anywhere; }
  .meta { font-size: .875rem; color: var(--text-secondary); margin-top: 2px; }
  .item.done .meta { color: var(--aperto-testo); font-weight: 600; }
  .badge { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .03em; padding: 2px 8px;
           border-radius: var(--r-pill); background: var(--info-bg); color: var(--blu-notte); margin-left: 6px; vertical-align: 2px; white-space: nowrap; }
  .links { display: flex; gap: 8px; margin-top: 6px; }
  .links:empty { display: none; }
  .links a { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
             background: var(--pill-quieto-sottile); color: var(--pill-text); }
  .links a:active { background: var(--pill-quieto); }

  .panel { padding: 4px 16px 16px 64px; }
  .panel .lbl { font-size: .8rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
  .chans { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  .btn-s { height: 44px; padding: 0 18px; border-radius: var(--r-capsule); font: inherit; font-weight: 800; font-size: .95rem; cursor: pointer; border: 1.5px solid transparent; }
  .btn-s.primary { background: var(--terracotta); color: #fff; }
  .btn-s.primary:disabled { opacity: .45; cursor: default; }
  .btn-s.ghost { background: transparent; color: var(--text); border-color: var(--border); }
  .btn-s.danger { background: transparent; color: var(--errore-testo); border-color: var(--errore-bg); }
  .who-hint { font-size: .85rem; color: var(--text-secondary); }

  /* Stati */
  .screen { min-height: 70vh; display: grid; place-items: center; text-align: center; padding: 40px 16px; }
  .screen h2 { font-family: var(--font-serif); font-weight: 400; font-size: 1.8rem; margin: 14px 0 6px; }
  .screen p { color: var(--text-secondary); max-width: 34ch; margin-inline: auto; }
  .skel { height: 64px; border-top: 1px solid var(--pill-quieto-sottile);
          background: linear-gradient(90deg, var(--surface) 0%, var(--pill-quieto-sottile) 50%, var(--surface) 100%);
          background-size: 200% 100%; animation: shimmer 1.2s linear infinite; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
           background: var(--bruno-seppia); color: #fff; padding: 12px 18px; border-radius: var(--r-capsule);
           font-weight: 700; font-size: .95rem; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none;
           transition: opacity .2s, transform .25s var(--ease); max-width: calc(100% - 32px); z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--errore-testo); }
  .updated { text-align: center; font-size: .8rem; color: var(--text-secondary); padding: 28px 0 40px; }

  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div id="invalid" class="screen" hidden>
  <div>
    <img src="/assets/logo-in.svg" alt="" width="56" height="56">
    <h2>Link non valido</h2>
    <p>Questa pagina funziona solo col link completo. Chiedilo al team di InComune.</p>
  </div>
</div>

<div id="loading" class="screen" hidden>
  <div>
    <img src="/assets/logo-in.svg" alt="" width="56" height="56">
    <p id="loading-msg" style="margin-top:14px">Caricamento…</p>
  </div>
</div>

<div id="app" hidden>
  <header class="top col">
    <div class="top-row">
      <img src="/assets/logo-in.svg" alt="InComune">
      <div>
        <h1>Contatti inviti</h1>
        <p>Chi abbiamo già sentito per l'accesso anticipato</p>
      </div>
    </div>
    <nav class="jumps" id="jumps" aria-label="Sezioni"></nav>
  </header>

  <div class="bar">
    <div class="col">
      <label class="search" id="search-wrap">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Cerca un nome" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="Cerca per nome">
        <button type="button" class="clear" id="q-clear" aria-label="Svuota la ricerca">×</button>
      </label>
      <div class="row-ctl" id="status" role="group" aria-label="Filtro"></div>
      <div class="row-ctl" id="me" role="group" aria-label="Chi sei"></div>
    </div>
  </div>

  <main class="col" id="sections"></main>
  <p class="updated col" id="updated"></p>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module">
import { CHANNELS, PEOPLE, SECTIONS, counts, effectiveChannel, filterRows, formatWhen, keyOf, mergeRows, normalize, readToken, sortByName, takenOver } from '/contatti/core.mjs';

const API = 'https://dijicgloszsmomgyxjlf.supabase.co/rest/v1/rpc/';
const KEY = 'sb_publishable_rcL38ApNvR8oupM9MJTKNg_iXHgcnWc';
const LS_TOKEN = 'incomune-contatti-token';
const LS_ME = 'incomune-contatti-me';
const POLL_MS = 20000;

const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const token = readToken(location.hash, store.get(LS_TOKEN));
const state = {
  rows: new Map(),        // key -> riga dal server
  open: null,             // key della riga col pannello aperto
  chan: null,             // canale scelto nel pannello
  pending: new Set(),     // key con salvataggio in volo
  query: '',
  status: 'all',
  me: PEOPLE.includes(store.get(LS_ME)) ? store.get(LS_ME) : null,
  sig: '',
  loadedAt: null,
};
const chanLabel = (id) => CHANNELS.find((c) => c.id === id)?.label ?? id;

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function socialUrl(v, host) {
  const s = String(v ?? '').trim();
  if (!s) return null;
  if (/^https?:\/\//i.test(s)) return s;
  if (/^(www\.)?(facebook|instagram|fb)\.com\//i.test(s)) return 'https://' + s;
  const h = s.replace(/^@/, '').replace(/\s+/g, '');
  return /^[\w.\-]+$/.test(h) ? `https://${host}/${h}` : null;
}
function telUrl(v) {
  const s = String(v ?? '').replace(/[^\d+]/g, '');
  return s.length >= 6 ? 'tel:' + s : null;
}

async function rpc(name, body) {
  const res = await fetch(API + name, {
    method: 'POST',
    headers: { apikey: KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: token, ...body }),
    cache: 'no-store',
  });
  const text = await res.text();
  const data = text ? JSON.parse(text) : null;
  if (!res.ok) {
    const err = new Error(data?.message || `HTTP ${res.status}`);
    err.code = data?.code;
    throw err;
  }
  return data;
}

let toastTimer;
function toast(msg, isErr = false) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.toggle('err', isErr);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), isErr ? 4500 : 2200);
}

let pollId = null;
function showInvalid() {
  // Cancella il codice ricordato solo se è proprio quello rifiutato (non per un link storpiato).
  if (store.get(LS_TOKEN) === token) store.del(LS_TOKEN);
  if (pollId) clearInterval(pollId);
  $('loading').hidden = true;
  $('app').hidden = true;
  $('invalid').hidden = false;
}

/* ---------- Render ---------- */

const ICON_CHECK = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
const ICON_TEL = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
const ICON_FB = '<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14 8h3V4h-3c-2.8 0-4.5 1.8-4.5 4.6V11H7v4h2.5v7h4v-7H17l.5-4h-4V8.9c0-.6.3-.9.5-.9z"/></svg>';
const ICON_IG = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';

function renderControls() {
  const st = [['all', 'Tutte'], ['todo', 'Da contattare'], ['done', 'Contattate']];
  $('status').innerHTML = st.map(([id, l]) =>
    `<button type="button" class="chip" data-status="${id}" aria-pressed="${state.status === id}">${l}</button>`).join('');
  $('me').innerHTML = `<span class="ctl-label">Sono</span>` + PEOPLE.map((p) =>
    `<button type="button" class="chip" data-me="${p}" aria-pressed="${state.me === p}">${p}</button>`).join('');
}

function renderJumps(all) {
  const c = counts(all);
  $('jumps').innerHTML = SECTIONS.map(({ type, title }) => {
    const { done, total } = c[type];
    const pct = total ? Math.round((done / total) * 100) : 0;
    // Bottone, non <a href="#...">: un'ancora sostituirebbe il codice nel frammento del link.
    return `<button type="button" class="jump" data-jump="sez-${type}"><b>${done}<small>/${total}</small></b><span>${title}</span>
      <div class="meter"><i style="width:${pct}%"></i></div></button>`;
  }).join('');
}

function renderItem(r) {
  const k = keyOf(r);
  const done = !!r.contacted_at;
  const open = state.open === k;
  const busy = state.pending.has(k);
  const tel = telUrl(r.phone), fb = socialUrl(r.facebook, 'facebook.com'), ig = socialUrl(r.instagram, 'instagram.com');
  const meta = done
    ? `${esc(r.contacted_by)} · ${esc(chanLabel(r.channel))} · ${esc(formatWhen(r.contacted_at))}`
    : (open ? 'Come l\'hai contattata?' : 'Da contattare');
  let panel = '';
  if (open) {
    const sel = effectiveChannel(state.chan, r);
    panel = `<div class="panel">
      <div class="lbl">Canale</div>
      <div class="chans">${CHANNELS.map((c) =>
        `<button type="button" class="chip" data-chan="${c.id}" aria-pressed="${sel === c.id}">${c.label}</button>`).join('')}</div>
      <div class="actions">
        <button type="button" class="btn-s primary" data-act="save" ${sel && !busy ? '' : 'disabled'}>${busy ? 'Salvo…' : (done ? 'Aggiorna' : 'Salva')}</button>
        <button type="button" class="btn-s ghost" data-act="cancel">Annulla</button>
        ${done ? '<button type="button" class="btn-s danger" data-act="clear">Togli il contatto</button>' : ''}
        <span class="who-hint">${state.me ? `come ${esc(state.me)}` : 'scegli chi sei in alto'}</span>
      </div>
    </div>`;
  }
  return `<li class="item${done ? ' done' : ''}${open ? ' open' : ''}" data-key="${esc(k)}">
    <div class="item-main">
      <button type="button" class="tick" data-act="tick" aria-pressed="${done}"
        aria-label="${done ? 'Contattata: modifica' : 'Segna come contattata'} ${esc(r.name)}"><i>${ICON_CHECK}</i></button>
      <div class="body" data-act="tick">
        <div class="name">${esc(r.name)}${r.claimed ? '<span class="badge">già rivendicata</span>' : ''}</div>
        <div class="meta">${meta}</div>
        <div class="links">${[
          tel ? `<a href="${esc(tel)}" aria-label="Chiama ${esc(r.name)}">${ICON_TEL}</a>` : '',
          fb ? `<a href="${esc(fb)}" target="_blank" rel="noopener noreferrer" aria-label="Facebook di ${esc(r.name)}">${ICON_FB}</a>` : '',
          ig ? `<a href="${esc(ig)}" target="_blank" rel="noopener noreferrer" aria-label="Instagram di ${esc(r.name)}">${ICON_IG}</a>` : '',
        ].join('')}</div>
      </div>
    </div>${panel}
  </li>`;
}

function renderLists() {
  const all = [...state.rows.values()];
  renderJumps(all);
  const filtering = !!normalize(state.query) || state.status !== 'all';
  $('sections').innerHTML = SECTIONS.map(({ type, title }) => {
    const rows = sortByName(filterRows(all.filter((r) => r.entity_type === type), { query: state.query, status: state.status }));
    const total = all.filter((r) => r.entity_type === type).length;
    const label = filtering ? `${rows.length} di ${total}` : `${total}`;
    const body = rows.length
      ? rows.map(renderItem).join('')
      : `<li class="empty">${filtering ? 'Nessun nome con questi filtri.' : 'Nessuna scheda attiva.'}</li>`;
    return `<section class="sez" id="sez-${type}"><h2>${title}<span>${label}</span></h2><ul class="list">${body}</ul></section>`;
  }).join('');
  if (state.loadedAt) {
    $('updated').textContent = `Aggiornata alle ${new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(state.loadedAt)} · si aggiorna da sola`;
  }
}

function renderSkeleton() {
  $('sections').innerHTML = SECTIONS.map(({ type, title }) =>
    `<section class="sez" id="sez-${type}"><h2>${title}<span>…</span></h2><ul class="list">${'<li class="skel"></li>'.repeat(4)}</ul></section>`).join('');
}

/* ---------- Dati ---------- */

let loading = false;
let again = false;     // richiesta arrivata mentre un giro era in corso: rifarlo subito dopo
let writeSeq = 0;      // cresce a ogni scrittura conclusa: scarta le letture partite prima
let started = false;
async function load({ force = false } = {}) {
  if (loading) { again = true; return; }
  loading = true;
  const seq = writeSeq;
  try {
    const data = await rpc('invite_outreach_list', {});
    if (seq !== writeSeq) { again = true; return; } // letta prima di una scrittura: vecchia
    const prevOpen = state.open ? state.rows.get(state.open) : null;
    state.rows = mergeRows(state.rows, data, state.pending);
    state.loadedAt = new Date();
    if (state.open && takenOver(prevOpen, state.rows.get(state.open))) {
      const r = state.rows.get(state.open);
      state.open = null; state.chan = null;
      toast(`${r.contacted_by} ha appena segnato «${r.name}»`, true);
      force = true;
    }
    if (!started) {
      started = true;
      store.set(LS_TOKEN, token);
      $('loading').hidden = true;
      $('app').hidden = false;
      force = true;
    }
    const sig = JSON.stringify([...state.rows.values()].map((r) => [keyOf(r), r.contacted_at, r.channel, r.contacted_by, r.claimed, r.name]).sort());
    if (force || sig !== state.sig) { state.sig = sig; renderLists(); }
    else $('updated').textContent = `Aggiornata alle ${new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit', second: '2-digit' }).format(state.loadedAt)} · si aggiorna da sola`;
  } catch (e) {
    if (e.code === '28000' || e.message === 'invalid_token') return showInvalid();
    if (!started) $('loading-msg').textContent = 'Connessione assente: riprovo tra poco.';
    else toast('Connessione assente: riprovo tra poco.', true);
  } finally {
    loading = false;
    if (again) { again = false; load({ force: true }); }
  }
}

function afterWrite(k) {
  state.pending.delete(k);
  writeSeq += 1;
  state.sig = '';
  renderLists();
  load({ force: true });
}

async function save(k) {
  const r = state.rows.get(k);
  const chan = effectiveChannel(state.chan, r);
  if (!r || !chan) return;
  if (!state.me) { nudgeMe(); return; }
  const me = state.me;
  state.pending.add(k);
  renderLists();
  try {
    const at = await rpc('invite_outreach_set', { p_entity_type: r.entity_type, p_entity_id: r.entity_id, p_channel: chan, p_by: me });
    state.rows.set(k, { ...r, contacted_at: at, channel: chan, contacted_by: me });
    if (state.open === k) { state.open = null; state.chan = null; }
    toast(`${r.name}: contattata`);
  } catch (e) {
    if (e.code === '28000' || e.message === 'invalid_token') return showInvalid();
    toast(e.message === 'entity_not_active' ? 'Questa scheda non è più attiva.' : 'Non salvato: controlla la connessione e riprova.', true);
  } finally {
    afterWrite(k);
  }
}

async function clearContact(k) {
  const r = state.rows.get(k);
  if (!r) return;
  if (!confirm(`Togliere il contatto di «${r.name}»?`)) return;
  state.pending.add(k);
  renderLists();
  try {
    await rpc('invite_outreach_clear', { p_entity_type: r.entity_type, p_entity_id: r.entity_id });
    state.rows.set(k, { ...r, contacted_at: null, channel: null, contacted_by: null });
    if (state.open === k) { state.open = null; state.chan = null; }
    toast(`${r.name}: da contattare`);
  } catch (e) {
    if (e.code === '28000' || e.message === 'invalid_token') return showInvalid();
    toast('Non tolto: controlla la connessione e riprova.', true);
  } finally {
    afterWrite(k);
  }
}

function nudgeMe() {
  toast('Prima scegli chi sei, in alto.', true);
  document.querySelector('.bar').scrollIntoView({ block: 'nearest' });
  $('me').querySelectorAll('.chip').forEach((b) => {
    b.classList.remove('me-missing'); void b.offsetWidth; b.classList.add('me-missing');
  });
}

/* ---------- Eventi ---------- */

$('jumps').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-jump]');
  if (b) $(b.dataset.jump)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

$('sections').addEventListener('click', (ev) => {
  if (ev.target.closest('a')) return; // link tel/FB/IG: non aprono il pannello
  const t = ev.target.closest('[data-act], [data-chan]');
  const li = ev.target.closest('.item');
  if (!t || !li) return;
  const k = li.dataset.key;
  if (t.dataset.chan) { state.chan = t.dataset.chan; renderLists(); return; }
  const act = t.dataset.act;
  if (act === 'tick') {
    if (state.open === k) { state.open = null; state.chan = null; }
    else { state.open = k; state.chan = null; if (!state.me) nudgeMe(); }
    renderLists();
  } else if (act === 'cancel') { state.open = null; state.chan = null; renderLists(); }
  else if (act === 'save') save(k);
  else if (act === 'clear') clearContact(k);
});

$('status').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-status]');
  if (!b) return;
  state.status = b.dataset.status; renderControls(); renderLists();
});
$('me').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-me]');
  if (!b) return;
  state.me = b.dataset.me; store.set(LS_ME, state.me); renderControls(); renderLists();
});
let qTimer;
$('q').addEventListener('input', (ev) => {
  state.query = ev.target.value;
  $('search-wrap').classList.toggle('has-q', !!state.query);
  clearTimeout(qTimer);
  qTimer = setTimeout(renderLists, 80);
});
$('q-clear').addEventListener('click', (ev) => {
  ev.preventDefault();
  $('q').value = ''; state.query = '';
  $('search-wrap').classList.remove('has-q');
  renderLists(); $('q').focus();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

/* ---------- Avvio ---------- */

if (!token) {
  showInvalid();
} else {
  // La pagina resta nascosta finché il server non ha accettato il codice.
  $('loading').hidden = false;
  renderControls();
  renderSkeleton();
  load({ force: true });
  pollId = setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
}
</script>
</body>
</html>
