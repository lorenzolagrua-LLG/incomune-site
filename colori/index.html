<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scegli il colore di InComune</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="colori.css">
</head>
<body>
  <main class="torneo-wrap">
    <section id="intro" class="panel">
      <p class="eyebrow">Sondaggio colori</p>
      <h1>Aiutaci a scegliere il colore di InComune</h1>
      <p class="lede">Sfida i colori a coppie e scegli il tuo preferito, fino al campione. Bastano due minuti, e il voto resta anonimo. Grazie dal team di InComune.</p>
      <div class="field">
        <label for="nick">Come ti chiami? (facoltativo)</label>
        <input id="nick" type="text" maxlength="40" autocomplete="off" placeholder="Il tuo nome">
      </div>
      <button id="start" type="button" class="cta">Inizia</button>
    </section>

    <section id="game" hidden>
      <p class="progress" id="progress" aria-live="polite"></p>
      <div class="versus">
        <button class="choice" id="choiceA" type="button" aria-label="Scegli il colore a sinistra"></button>
        <span class="vs" aria-hidden="true">vs</span>
        <button class="choice" id="choiceB" type="button" aria-label="Scegli il colore a destra"></button>
      </div>
    </section>

    <section id="final" hidden class="panel">
      <p class="eyebrow">Campione</p>
      <h2>Il tuo colore è</h2>
      <div id="winner"></div>
      <button id="again" type="button" class="cta ghost">Gioca di nuovo</button>
    </section>
  </main>

  <script type="module" src="colori.js"></script>
</body>
</html>
