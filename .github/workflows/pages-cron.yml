# Giro periodico delle pagine evento: ogni 15 minuti, sfalsato dall'inizio
# dell'ora, richiama pages.yml con from_cron (generatore bloccante).
#
# Lo avvia Supabase, non lo `schedule` di GitHub: il job pg_cron
# `pages-cron-dispatch` (7,22,37,52 * * * * UTC) chiama l'API workflow_dispatch
# con un token fine-grained (solo questo repo, Actions: write) salvato nel Vault
# come `github_pages_dispatch_token`. Lo schedule di GitHub, la notte del
# 20-21 ott 2026, e' partito 2 volte su circa 40 (la doc lo ammette: sotto
# carico i giri vengono ritardati o scartati). Senza schedule cade anche lo
# spegnimento automatico dopo 60 giorni senza attivita'.
#
# Se il giro non parte (token scaduto o revocato, job spento) Sentry segnala il
# check-in mancato. Avvio a mano: Actions -> Pages (cron) -> Run workflow.
#
# Niente concurrency qui: la gestisce pages.yml (gruppo `pages`).

name: Pages (cron)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pagine:
    # Il chiamato puo' solo ridurre i permessi che riceve: qui quelli che servono
    # a build (contents: read) e deploy (pages: write, id-token: write).
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      from_cron: true
    secrets: inherit

  check-in:
    # Solo se il giro e' riuscito: build verde (generatore bloccante compreso) e
    # deploy fatto, oppure saltato perche' main e' gia' andato avanti e pubblica
    # il run piu' recente. Un giro annullato o fallito non fa check-in.
    # Mai bloccante; senza secret si salta.
    needs: pagine
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Check-in Sentry Cron
        env:
          SENTRY_CRON_URL: ${{ secrets.SENTRY_CRON_URL }}
        run: |
          if [ -z "$SENTRY_CRON_URL" ]; then exit 0; fi
          case "$SENTRY_CRON_URL" in *\?*) sep='&' ;; *) sep='?' ;; esac
          # Niente set -x ne' echo dell'URL: contiene la chiave pubblica del progetto.
          if ! curl -fsS --max-time 10 -o /dev/null "${SENTRY_CRON_URL}${sep}status=ok" 2>/dev/null; then
            echo "::warning::Check-in Sentry non riuscito (il deploy e' comunque andato a buon fine)."
          fi
